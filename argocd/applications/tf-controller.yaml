apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tf-controller
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/souaibou18/gitops-souaibou
    targetRevision: HEAD
    path: infrastructure/tf-controller/controllers
  destination:
    server: https://kubernetes.default.svc
    namespace: flux-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
