apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/souaibou18/gitops-souaibou
    targetRevision: HEAD
    path: security/sealed-secrets/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: todo-api-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
